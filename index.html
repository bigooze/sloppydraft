<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sloppydraft</title>
<style>
/* Theme tokens keep the dark and light palettes in one place. */
:root {
    color-scheme: dark;
    --page-bg: #222522;
    --text: #d8d9d1;
    --editor-text: #c8cec0;
    --muted: #a3a79d;
    --placeholder: #888e83;
    --accent: #b3bd91;
    --accent-hover: #c5cea4;
    --border: #41463f;
    --field-border: #565c52;
    --focus: #aebc8c;
}

:root.light-mode {
    color-scheme: light;
    --page-bg: #f2f0e8;
    --text: #393d36;
    --editor-text: #3d433a;
    --placeholder: #686d63;
    --muted: #62685f;
    --accent: #5d704e;
    --accent-hover: #516443;
    --border: #d1d0c5;
    --field-border: #b9bbae;
    --focus: #7b8b69;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    color: var(--text);
}

/* Toolbar */
.toolbar {
    min-height: 72px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 1px solid var(--border);
}

.toolbar-identity {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 20px;
}

.toolbar[hidden],
#show-toolbar[hidden] {
    display: none;
}

.brand {
    margin: 0;
    font: 600 12px/1 Georgia, serif;
    color: var(--text);
}

.toolbar-actions {
    position: relative;
}

.options-toggle {
    min-height: 38px;
    border: 1px solid var(--field-border);
    border-radius: 3px;
    padding: 0 14px;
    background: transparent;
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    cursor: pointer;
}

.options-toggle:hover,
.options-menu[open] .options-toggle {
    border-color: var(--accent);
    color: var(--accent-hover);
}

.options-toggle:focus-visible,
.options-panel button:focus-visible,
.options-panel a:focus-visible,
.options-panel input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
}

.options-panel {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    z-index: 3;
    width: min(340px, calc(100vw - 36px));
    max-height: min(75vh, 620px);
    padding: 18px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--page-bg);
    box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
    color: var(--text);
}

.options-group + .options-group {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

.options-heading {
    margin: 0 0 10px;
    color: var(--muted);
    font: 600 11px/1.4 system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.goal-fields {
    display: grid;
    gap: 10px;
}

.goal-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font: 13px/1.4 system-ui, sans-serif;
}

.goal-field input {
    width: 112px;
    min-height: 36px;
    border: 1px solid var(--field-border);
    border-radius: 3px;
    padding: 6px 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
}

.options-note {
    margin: 8px 0 0;
    color: var(--muted);
    font: 12px/1.4 system-ui, sans-serif;
}

.visibility-options,
.menu-actions {
    display: grid;
    gap: 8px;
}

.visibility-option {
    display: flex;
    align-items: center;
    gap: 9px;
    font: 13px/1.4 system-ui, sans-serif;
}

.visibility-option input {
    accent-color: var(--accent);
}

.menu-actions {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.menu-actions button,
.menu-actions a {
    min-height: 38px;
    border: 1px solid var(--field-border);
    border-radius: 3px;
    padding: 8px 10px;
    background: transparent;
    color: var(--text);
    font: 13px/1.3 system-ui, sans-serif;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.menu-actions button:hover,
.menu-actions a:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

.menu-actions #burn {
    width: auto;
    height: auto;
}

.menu-actions #export,
.menu-actions #import,
.menu-actions #font-mode,
.menu-actions #light-mode {
    width: 100%;
    height: auto;
    min-height: 38px;
}

.menu-actions #burn-control {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
}

.menu-actions #burn-prompt {
    top: auto;
    right: 0;
    bottom: calc(100% + 4px);
    left: auto;
    transform: none;
    max-width: 220px;
    text-align: right;
}

.menu-actions #hide-toolbar {
    grid-column: 1 / -1;
    width: auto;
    height: auto;
    min-height: 38px;
    padding: 8px 10px;
    font: 13px/1.3 system-ui, sans-serif;
}

#footer-counts {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 2;
    min-height: 34px;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 20px;
    border-top: 1px solid var(--border);
    background: var(--page-bg);
    color: var(--muted);
    font: 11px/1.4 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
}

.footer-count[hidden] {
    display: none;
}

.footer-count strong {
    color: var(--text);
    font-weight: 500;
}

.footer-count output {
    color: var(--text);
}

#session-timer {
    min-height: 24px;
    border: 1px solid var(--field-border);
    border-radius: 3px;
    padding: 2px 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
}

#session-timer:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

#session-timer:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
}

#timer-status {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    clip-path: inset(50%);
}

#work-name {
    width: 150px;
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: 3px;
    padding: 8px 10px;
    background: transparent;
    color: var(--text);
    font: 13px/1.2 system-ui, sans-serif;
}

#work-name::placeholder {
    color: var(--placeholder);
}

#work-name:focus-visible {
    border-color: var(--focus);
    outline: 2px solid var(--focus);
    outline-offset: 2px;
}

#export,
#import,
#font-mode,
#light-mode,
#burn,
#hide-toolbar,
#show-toolbar {
    border: 1px solid var(--placeholder);
    border-radius: 3px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--text);
    cursor: pointer;
}

#hide-toolbar {
    width: 36px;
    height: 36px;
}

#export:hover,
#import:hover,
#font-mode:hover,
#light-mode:hover,
#burn:hover,
#hide-toolbar:hover,
#show-toolbar:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

#export:focus-visible,
#import:focus-visible,
#font-mode:focus-visible,
#light-mode:focus-visible,
#burn:focus-visible,
#hide-toolbar:focus-visible,
#show-toolbar:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
}

#burn-control {
    position: relative;
}

#show-toolbar {
    position: fixed;
    top: 12px;
    right: 18px;
    z-index: 2;
    background: var(--page-bg);
}

body.toolbar-hidden #editor {
    min-height: 100vh;
    padding-top: 84px;
    padding-bottom: 70px;
}

#burn-prompt {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    width: max-content;
    max-width: min(220px, calc(100vw - 36px));
    color: var(--text);
    font: 6pt/1.3 system-ui, sans-serif;
    text-align: center;
}

#burn-prompt[hidden] {
    display: none;
}

#burn-countdown {
    font-variant-numeric: tabular-nums;
}

/* Writing area */
#editor {
    display: block;
    width: min(100%, 960px);
    min-height: calc(100vh - 72px);
    margin: 0 auto;
    border: none;
    outline: none;
    background: transparent;
    color: var(--editor-text);
    font-size: clamp(12pt, 2vw, 14pt);
    font-family: Georgia, serif;
    line-height: 1.75;
    padding: 48px 40px 80px;
    caret-color: var(--editor-text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    cursor: text;
}

#editor:empty::before {
    content: attr(data-placeholder);
    color: var(--placeholder);
    pointer-events: none;
}

/* Import and export dialogs share their layout and interaction styles. */
#export-dialog,
#import-dialog {
    width: min(420px, calc(100vw - 32px));
    border: 1px solid var(--placeholder);
    border-radius: 4px;
    padding: 24px;
    background: var(--page-bg);
    color: var(--text);
}

#export-dialog::backdrop,
#import-dialog::backdrop {
    background: rgb(0 0 0 / 65%);
}

.dialog-heading {
    margin: 0 0 20px;
    font: 600 18px/1.3 Georgia, serif;
}

.dialog-actions {
    display: grid;
    gap: 8px;
}

.dialog-actions button,
#close-export,
#close-import {
    min-height: 40px;
    border: 1px solid var(--placeholder);
    border-radius: 3px;
    padding: 8px 12px;
    background: transparent;
    color: inherit;
    font: 14px/1.3 system-ui, sans-serif;
    text-align: left;
    cursor: pointer;
}

.dialog-actions button:hover,
#close-export:hover,
#close-import:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

#export-status,
#import-status {
    min-height: 1.4em;
    margin: 12px 0;
    color: var(--muted);
    font: 13px/1.4 system-ui, sans-serif;
}

#dropbox-files {
    display: grid;
    gap: 8px;
    max-height: min(300px, 40vh);
    margin-top: 12px;
    overflow-y: auto;
}

#dropbox-files:empty {
    display: none;
}

#dropbox-files button {
    overflow-wrap: anywhere;
}

#close-export,
#close-import {
    display: block;
    margin-left: auto;
}

#export-dialog button:focus-visible,
#import-dialog button:focus-visible,
#import-dialog input:focus-visible {
    outline: 2px solid var(--accent-hover);
    outline-offset: 2px;
}

:root.courier-mode,
:root.courier-mode * {
    font-family: "Courier New", Courier, monospace !important;
}

/* Keep the toolbar usable on narrow screens. */
@media (max-width: 600px) {
    .toolbar {
        min-height: 64px;
        padding: 0 18px;
        flex-wrap: wrap;
        padding-block: 12px;
    }

    .toolbar-identity {
        gap: 10px;
    }

    #work-name {
        width: min(130px, 38vw);
    }

    .options-panel {
        right: -4px;
    }

    #editor {
        min-height: calc(100vh - 64px);
        padding: 30px 22px 76px;
    }

    body.toolbar-hidden #editor {
        padding: 66px 22px 76px;
    }

    #footer-counts {
        justify-content: space-around;
        padding-inline: 10px;
    }
}
</style>
</head>

<body>
<header class="toolbar" id="toolbar">
    <div class="toolbar-identity">
        <h1 class="brand">sloppydraft</h1>
        <input id="work-name" type="text" aria-label="Work name" placeholder="Work name" autocomplete="off">
    </div>
    <div class="toolbar-actions">
        <details class="options-menu" id="options-menu">
            <summary class="options-toggle">Options</summary>
            <div class="options-panel" id="options-panel">
                <section class="options-group" aria-labelledby="goals-heading">
                    <h2 class="options-heading" id="goals-heading">Writing goals</h2>
                    <div class="goal-fields">
                        <label class="goal-field" for="total-goal">
                            <span>Total word goal</span>
                            <input id="total-goal" type="number" min="0" step="1" inputmode="numeric">
                        </label>
                        <label class="goal-field" for="session-goal">
                            <span>Session word goal</span>
                            <input id="session-goal" type="number" min="0" step="1" inputmode="numeric">
                        </label>
                    </div>
                    <p class="options-note">Set a goal of 0 for no goal.</p>
                </section>
                <section class="options-group" aria-labelledby="counts-heading">
                    <h2 class="options-heading" id="counts-heading">Bottom counts</h2>
                    <div class="visibility-options">
                        <label class="visibility-option"><input id="show-total-count" type="checkbox"> Show total word count</label>
                        <label class="visibility-option"><input id="show-session-count" type="checkbox"> Show session word count</label>
                    </div>
                </section>
                <section class="options-group" aria-labelledby="appearance-heading">
                    <h2 class="options-heading" id="appearance-heading">Appearance</h2>
                    <div class="menu-actions">
                        <button id="light-mode" type="button" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">Light mode</button>
                        <button id="font-mode" type="button" aria-label="Use Courier font" title="Use Courier font" aria-pressed="false">Courier font</button>
                    </div>
                </section>
                <section class="options-group" aria-labelledby="document-heading">
                    <h2 class="options-heading" id="document-heading">Document</h2>
                    <div class="menu-actions">
                        <button id="import" type="button" aria-label="Open document" aria-haspopup="dialog" aria-controls="import-dialog">Open</button>
                        <button id="export" type="button" aria-label="Export document" aria-haspopup="dialog" aria-controls="export-dialog">Export</button>
                        <div id="burn-control">
                            <span id="burn-prompt" role="status" aria-live="polite" hidden>
                                Press this 5 times in 5 seconds to burn everything
                                <span id="burn-countdown"></span>
                            </span>
                            <button id="burn" type="button" aria-label="Burn all writing" title="Burn all writing">🔥 Burn it down!</button>
                        </div>
                    </div>
                </section>
                <section class="options-group" aria-label="More options">
                    <div class="menu-actions">
                        <a id="readme-link" href="README.md">README</a>
                        <button id="hide-toolbar" type="button" aria-controls="toolbar" aria-expanded="true">Hide menu</button>
                    </div>
                </section>
            </div>
        </details>
    </div>
</header>
<button id="show-toolbar" type="button" aria-controls="toolbar" aria-expanded="false" aria-label="Show menu and branding" title="Show menu and branding" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
</button>
<main>
    <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document" data-placeholder="Start writing..." spellcheck="true"></div>
</main>
<footer id="footer-counts" aria-label="Writing progress and timer">
    <span class="footer-count" id="total-count-display"><strong>total</strong> <output id="total-word-count">0</output><span id="total-goal-display"></span></span>
    <span class="footer-count" id="session-count-display"><strong>session</strong> <output id="session-word-count">0</output><span id="session-goal-display"></span></span>
    <button id="session-timer" type="button" aria-label="Start 15-minute writing timer">Start 15:00</button>
    <span id="timer-status" role="status" aria-live="polite"></span>
</footer>
<dialog id="export-dialog" aria-labelledby="export-heading">
    <h2 class="dialog-heading" id="export-heading">Export document</h2>
    <div class="dialog-actions">
        <button id="dropbox-document" type="button">Send to Dropbox</button>
        <button id="copy-document" type="button">Copy text</button>
        <button id="download-document" type="button">Download .txt</button>
    </div>
    <p id="export-status" role="status" aria-live="polite"></p>
    <button id="close-export" type="button">Close</button>
</dialog>
<dialog id="import-dialog" aria-labelledby="import-heading">
    <h2 class="dialog-heading" id="import-heading">Open a document</h2>
    <div class="dialog-actions">
        <input id="local-file" type="file" accept=".txt,.md,text/plain" hidden>
        <button id="open-local-file" type="button">Open from this device</button>
        <button id="browse-dropbox" type="button">Open from Dropbox</button>
    </div>
    <div id="dropbox-files" aria-label="Dropbox text files"></div>
    <p id="import-status" role="status" aria-live="polite"></p>
    <button id="close-import" type="button">Close</button>
</dialog>
<script>
// Start here when following the app: the page is intentionally self-contained.
// These references connect the JavaScript to the controls in the HTML above.
const editor = document.getElementById("editor");
const totalWordCount = document.getElementById("total-word-count");
const sessionWordCount = document.getElementById("session-word-count");
const totalCountDisplay = document.getElementById("total-count-display");
const sessionCountDisplay = document.getElementById("session-count-display");
const totalGoalDisplay = document.getElementById("total-goal-display");
const sessionGoalDisplay = document.getElementById("session-goal-display");
const totalGoalInput = document.getElementById("total-goal");
const sessionGoalInput = document.getElementById("session-goal");
const showTotalCountInput = document.getElementById("show-total-count");
const showSessionCountInput = document.getElementById("show-session-count");
const sessionTimerButton = document.getElementById("session-timer");
const timerStatus = document.getElementById("timer-status");
const workName = document.getElementById("work-name");
const lightModeButton = document.getElementById("light-mode");
const fontModeButton = document.getElementById("font-mode");
const burnButton = document.getElementById("burn");
const burnPrompt = document.getElementById("burn-prompt");
const burnCountdown = document.getElementById("burn-countdown");
const toolbar = document.getElementById("toolbar");
const hideToolbarButton = document.getElementById("hide-toolbar");
const showToolbarButton = document.getElementById("show-toolbar");
const optionsMenu = document.getElementById("options-menu");
const DROPBOX_APP_KEY = "44zncdp835se0am";
const DROPBOX_REDIRECT_URI = `${window.location.origin}${window.location.pathname}`;
const DROPBOX_TRANSACTION_KEY = "dropbox-oauth-transaction";
const DROPBOX_TOKEN_KEY = "dropbox-access-token";
const DROPBOX_TEXT_FILE = /\.(txt|md)$/i;

// Preferences and drafts persist across reloads; OAuth tokens last only for this tab.
let lightMode = localStorage.getItem("light-mode") === "true";
let courierMode = localStorage.getItem("courier-mode") === "true";
let toolbarHidden = localStorage.getItem("toolbar-hidden") === "true";
let showTotalCount = localStorage.getItem("show-total-count") !== "false";
let showSessionCount = localStorage.getItem("show-session-count") !== "false";
let burnPresses = 0;
let burnDeadline = 0;
let burnTimer;
const SESSION_TIMER_DURATION = 15 * 60 * 1000;
let sessionTimerDeadline = 0;
let sessionTimerInterval;

workName.value = localStorage.getItem("work-name") || "";

// Restore the draft before attaching input handlers.
const savedHtml = localStorage.getItem("document-html");
if (savedHtml !== null) {
    editor.innerHTML = savedHtml;
} else {
    editor.textContent = localStorage.getItem("document") || "";
}

editor.querySelectorAll("s, del").forEach((markedWord) => {
    markedWord.replaceWith(document.createTextNode(`[${markedWord.textContent}]`));
});
editor.innerHTML = editor.innerHTML.replace(/~~([\s\S]*?)~~/g, "[$1]");

function countWords(text) {
    return (text.trim().match(/\S+/g) || []).length;
}

function loadGoal(key) {
    const savedGoal = localStorage.getItem(key);
    if (savedGoal === null) return 0;

    const goal = Number(savedGoal);
    if (!Number.isSafeInteger(goal) || goal < 0) {
        localStorage.removeItem(key);
        return 0;
    }
    return goal;
}

totalGoalInput.value = loadGoal("total-word-goal");
sessionGoalInput.value = loadGoal("session-word-goal");
showTotalCountInput.checked = showTotalCount;
showSessionCountInput.checked = showSessionCount;
const sessionStartWordCount = countWords(editor.textContent);

// Appearance and persistence
function updateFontMode() {
    document.documentElement.classList.toggle("courier-mode", courierMode);
    fontModeButton.setAttribute("aria-pressed", String(courierMode));
    fontModeButton.setAttribute("aria-label", courierMode ? "Use serif font" : "Use Courier font");
    fontModeButton.title = courierMode ? "Use serif font" : "Use Courier font";
    fontModeButton.textContent = courierMode ? "Serif font" : "Courier font";
}

function updateLightMode() {
    document.documentElement.classList.toggle("light-mode", lightMode);
    document.body.classList.toggle("light-mode", lightMode);
    lightModeButton.setAttribute("aria-pressed", String(lightMode));
    lightModeButton.setAttribute("aria-label", lightMode ? "Switch to dark mode" : "Switch to light mode");
    lightModeButton.title = lightMode ? "Switch to dark mode" : "Switch to light mode";
    lightModeButton.textContent = lightMode ? "Dark mode" : "Light mode";
}

function setToolbarHidden(hidden, moveFocus = true) {
    toolbarHidden = hidden;
    if (hidden) optionsMenu.open = false;
    toolbar.hidden = hidden;
    showToolbarButton.hidden = !hidden;
    hideToolbarButton.setAttribute("aria-expanded", String(!hidden));
    showToolbarButton.setAttribute("aria-expanded", String(hidden));
    document.body.classList.toggle("toolbar-hidden", hidden);
    localStorage.setItem("toolbar-hidden", String(hidden));

    if (moveFocus) {
        (hidden ? showToolbarButton : optionsMenu.querySelector("summary")).focus();
    }
}

function updateWordCounts() {
    const total = countWords(editor.textContent);
    const session = Math.max(0, total - sessionStartWordCount);
    const totalGoal = Number(totalGoalInput.value) || 0;
    const sessionGoal = Number(sessionGoalInput.value) || 0;

    totalWordCount.textContent = total.toLocaleString();
    sessionWordCount.textContent = session.toLocaleString();
    totalGoalDisplay.textContent = `${total === 1 ? " word" : " words"}${totalGoal ? ` · goal ${totalGoal.toLocaleString()}` : ""}`;
    sessionGoalDisplay.textContent = `${session === 1 ? " word" : " words"}${sessionGoal ? ` · goal ${sessionGoal.toLocaleString()}` : ""}`;
    totalCountDisplay.hidden = !showTotalCount;
    sessionCountDisplay.hidden = !showSessionCount;
}

function saveEditor() {
    localStorage.setItem("document-html", editor.innerHTML);
    updateWordCounts();
}

function updateSessionTimer() {
    const remaining = Math.max(0, sessionTimerDeadline - Date.now());
    if (remaining === 0) {
        clearInterval(sessionTimerInterval);
        sessionTimerInterval = null;
        sessionTimerDeadline = 0;
        sessionTimerButton.textContent = "Restart 15:00";
        sessionTimerButton.setAttribute("aria-label", "Restart 15-minute writing timer");
        timerStatus.textContent = "15-minute writing timer complete.";
        return;
    }

    const totalSeconds = Math.ceil(remaining / 1000);
    const display = `${String(Math.floor(totalSeconds / 60)).padStart(2, "0")}:${String(totalSeconds % 60).padStart(2, "0")}`;
    sessionTimerButton.textContent = `Stop ${display}`;
    sessionTimerButton.setAttribute("aria-label", `Stop 15-minute writing timer with ${display} remaining`);
}

sessionTimerButton.addEventListener("click", () => {
    if (sessionTimerInterval) {
        clearInterval(sessionTimerInterval);
        sessionTimerInterval = null;
        sessionTimerDeadline = 0;
        sessionTimerButton.textContent = "Start 15:00";
        sessionTimerButton.setAttribute("aria-label", "Start 15-minute writing timer");
        timerStatus.textContent = "Timer stopped.";
        return;
    }

    timerStatus.textContent = "";
    sessionTimerDeadline = Date.now() + SESSION_TIMER_DURATION;
    updateSessionTimer();
    sessionTimerInterval = setInterval(updateSessionTimer, 250);
});

// Strict-draft editing
// DOM ranges use node positions; these helpers translate between those positions
// and character offsets so word selection works across multiple text nodes.
function textOffsetAt(node, offset) {
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.setEnd(node, offset);
    return range.toString().length;
}

function pointAtTextOffset(targetOffset) {
    const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
    let node;
    let lastNode;
    let remaining = targetOffset;

    while ((node = walker.nextNode())) {
        lastNode = node;
        if (remaining <= node.nodeValue.length) {
            return { node, offset: remaining };
        }
        remaining -= node.nodeValue.length;
    }

    return lastNode
        ? { node: lastNode, offset: lastNode.nodeValue.length }
        : { node: editor, offset: 0 };
}

function markWord(key) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;

    const words = Array.from(editor.textContent.matchAll(/\S+/g), (match) => ({
        start: match.index,
        end: match.index + match[0].length,
    }));
    let start;
    let end;

    if (!selection.isCollapsed) {
        const selected = selection.getRangeAt(0);
        const selectionStart = textOffsetAt(selected.startContainer, selected.startOffset);
        const selectionEnd = textOffsetAt(selected.endContainer, selected.endOffset);
        const selectedWords = words.filter((word) => word.end > selectionStart && word.start < selectionEnd);
        if (selectedWords.length) {
            start = selectedWords[0].start;
            end = selectedWords[selectedWords.length - 1].end;
        }
    } else {
        const cursor = textOffsetAt(selection.focusNode, selection.focusOffset);
        const currentWord = words.find((word) => cursor > word.start && cursor < word.end);
        const target = currentWord || (key === "Backspace"
            ? words.filter((word) => word.end <= cursor).at(-1)
            : words.find((word) => word.start >= cursor));
        if (target) ({ start, end } = target);
    }

    if (start === undefined) return;
    const selectedText = editor.textContent.slice(start, end);
    if (/^\[[\s\S]*\]$/.test(selectedText)) return;

    const range = document.createRange();
    const rangeStart = pointAtTextOffset(start);
    const rangeEnd = pointAtTextOffset(end);
    range.setStart(rangeStart.node, rangeStart.offset);
    range.setEnd(rangeEnd.node, rangeEnd.offset);
    const markedContents = range.extractContents();
    const markedWord = document.createDocumentFragment();
    const openingMarker = document.createTextNode("[");
    const closingMarker = document.createTextNode("]");
    markedWord.append(openingMarker, markedContents, closingMarker);
    range.insertNode(markedWord);
    range.setStartAfter(closingMarker);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    saveEditor();
}

function insertTextAtSelection(text) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    range.deleteContents();
    const textNode = document.createTextNode(text);
    range.insertNode(textNode);
    range.setStartAfter(textNode);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    saveEditor();
}

// Apply saved settings and refresh the word count once on page load.
updateLightMode();
updateFontMode();
setToolbarHidden(toolbarHidden, false);
saveEditor();

hideToolbarButton.addEventListener("click", () => setToolbarHidden(true));
showToolbarButton.addEventListener("click", () => setToolbarHidden(false));

function saveGoal(input, key) {
    if (input.value === "") input.value = "0";
    if (!input.checkValidity() || !Number.isSafeInteger(input.valueAsNumber)) {
        input.reportValidity();
        return;
    }
    localStorage.setItem(key, String(input.valueAsNumber));
    updateWordCounts();
}

totalGoalInput.addEventListener("change", () => saveGoal(totalGoalInput, "total-word-goal"));
sessionGoalInput.addEventListener("change", () => saveGoal(sessionGoalInput, "session-word-goal"));

showTotalCountInput.addEventListener("change", () => {
    showTotalCount = showTotalCountInput.checked;
    localStorage.setItem("show-total-count", String(showTotalCount));
    updateWordCounts();
});

showSessionCountInput.addEventListener("change", () => {
    showSessionCount = showSessionCountInput.checked;
    localStorage.setItem("show-session-count", String(showSessionCount));
    updateWordCounts();
});

// Keep writing plain text, and route destructive keys through markWord().
editor.addEventListener("input", () => {
    saveEditor();
});

workName.addEventListener("input", () => {
    localStorage.setItem("work-name", workName.value);
});

editor.addEventListener("keydown", (event) => {
    if (event.key === "Backspace" || event.key === "Delete") {
        event.preventDefault();
        markWord(event.key);
    } else if (event.key === "Enter") {
        event.preventDefault();
        insertTextAtSelection("\n");
    }
});

editor.addEventListener("beforeinput", (event) => {
    if (event.inputType === "deleteContentBackward" || event.inputType === "deleteContentForward") {
        event.preventDefault();
        markWord(event.inputType === "deleteContentBackward" ? "Backspace" : "Delete");
    }
});

editor.addEventListener("paste", (event) => {
    event.preventDefault();
    insertTextAtSelection(event.clipboardData.getData("text/plain"));
});

lightModeButton.addEventListener("click", () => {
    lightMode = !lightMode;
    localStorage.setItem("light-mode", String(lightMode));
    updateLightMode();
});

fontModeButton.addEventListener("click", () => {
    courierMode = !courierMode;
    localStorage.setItem("courier-mode", String(courierMode));
    updateFontMode();
});

// The burn action is deliberately separate from normal editing and requires five presses.
function updateBurnCountdown() {
    const secondsRemaining = Math.max(0, Math.ceil((burnDeadline - Date.now()) / 1000));
    burnCountdown.textContent = ` (${secondsRemaining})`;
}

function resetBurnCountdown() {
    clearInterval(burnTimer);
    burnPresses = 0;
    burnDeadline = 0;
    burnPrompt.hidden = true;
}

burnButton.addEventListener("click", () => {
    const now = Date.now();
    if (burnPresses === 0 || now >= burnDeadline) {
        clearInterval(burnTimer);
        burnPresses = 0;
        burnDeadline = now + 5000;
        burnPrompt.hidden = false;
        updateBurnCountdown();
        burnTimer = setInterval(() => {
            if (Date.now() >= burnDeadline) {
                resetBurnCountdown();
            } else {
                updateBurnCountdown();
            }
        }, 100);
    }

    burnPresses += 1;
    if (burnPresses === 5 && now < burnDeadline) {
        editor.replaceChildren();
        workName.value = "";
        localStorage.removeItem("document-html");
        localStorage.removeItem("document");
        localStorage.removeItem("work-name");
        updateWordCounts();
        resetBurnCountdown();
        return;
    }

    updateBurnCountdown();
});

// Export
function createExportFile() {
    const filename = workName.value.trim()
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^\.+|\.+$/g, "") || "untitled";
    const now = new Date();
    const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
    ].join("-") + "_" + [
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0"),
    ].join("-");
    return new File([editor.textContent], `${filename}-${timestamp}.txt`, {
        type: "text/plain;charset=utf-8",
    });
}

const exportDialog = document.getElementById("export-dialog");
const exportStatus = document.getElementById("export-status");
const importDialog = document.getElementById("import-dialog");
const importStatus = document.getElementById("import-status");
const dropboxFiles = document.getElementById("dropbox-files");

// Dropbox uses OAuth 2.0 with PKCE so no client secret is stored in this page.
function randomBase64Url(byteLength) {
    const bytes = crypto.getRandomValues(new Uint8Array(byteLength));
    return btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
}

async function getDropboxError(response) {
    try {
        const details = await response.json();
        return details.error_summary || details.error_description || `Dropbox returned ${response.status}.`;
    } catch {
        return `Dropbox returned ${response.status}.`;
    }
}

async function uploadToDropbox(accessToken) {
    const file = createExportFile();
    const apiArguments = JSON.stringify({
        path: `/${file.name}`,
        mode: "add",
        autorename: true,
        mute: true,
    }).replace(/[\u007f-\uffff]/g, (character) =>
        `\\u${character.charCodeAt(0).toString(16).padStart(4, "0")}`
    );
    const response = await fetch("https://content.dropboxapi.com/2/files/upload", {
        method: "POST",
        headers: {
            Authorization: `Bearer ${accessToken}`,
            "Dropbox-API-Arg": apiArguments,
            "Content-Type": "application/octet-stream",
        },
        body: file,
    });

    if (!response.ok) {
        if (response.status === 401) sessionStorage.removeItem(DROPBOX_TOKEN_KEY);
        throw new Error(await getDropboxError(response));
    }

    exportStatus.textContent = `Saved ${file.name} to Dropbox.`;
}

async function startDropboxAuthorization(action) {
    const verifier = randomBase64Url(64);
    const state = randomBase64Url(32);
    const challengeBytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const challenge = btoa(String.fromCharCode(...new Uint8Array(challengeBytes)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    sessionStorage.setItem(DROPBOX_TRANSACTION_KEY, JSON.stringify({ verifier, state, action }));

    const authorizationUrl = new URL("https://www.dropbox.com/oauth2/authorize");
    authorizationUrl.search = new URLSearchParams({
        client_id: DROPBOX_APP_KEY,
        response_type: "code",
        token_access_type: "online",
        redirect_uri: DROPBOX_REDIRECT_URI,
        code_challenge: challenge,
        code_challenge_method: "S256",
        state,
        scope: "files.content.read files.content.write files.metadata.read",
    });
    window.location.assign(authorizationUrl);
}

// Dropbox redirects back here with a short-lived code; exchange it, then resume
// the action (browse or upload) saved in sessionStorage before leaving the page.
async function finishDropboxAuthorization() {
    const callbackUrl = new URL(window.location.href);
    const code = callbackUrl.searchParams.get("code");
    const authorizationError = callbackUrl.searchParams.get("error");
    if (!code && !authorizationError) return;

    window.history.replaceState(null, "", DROPBOX_REDIRECT_URI);
    let transaction;
    try {
        transaction = JSON.parse(sessionStorage.getItem(DROPBOX_TRANSACTION_KEY));
    } catch {
        transaction = null;
    }
    sessionStorage.removeItem(DROPBOX_TRANSACTION_KEY);

    const isBrowse = transaction?.action === "browse";
    const dialog = isBrowse ? importDialog : exportDialog;
    const status = isBrowse ? importStatus : exportStatus;
    if (!transaction || !["browse", "upload"].includes(transaction.action)
        || callbackUrl.searchParams.get("state") !== transaction.state) {
        dialog.showModal();
        status.textContent = "Dropbox sign-in could not be verified. Please try again.";
        return;
    }
    if (authorizationError) {
        dialog.showModal();
        status.textContent = "Dropbox access was not granted.";
        return;
    }

    dialog.showModal();
    status.textContent = "Connecting to Dropbox...";
    try {
        const response = await fetch("https://api.dropboxapi.com/oauth2/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                code,
                grant_type: "authorization_code",
                client_id: DROPBOX_APP_KEY,
                redirect_uri: DROPBOX_REDIRECT_URI,
                code_verifier: transaction.verifier,
            }),
        });
        if (!response.ok) throw new Error(await getDropboxError(response));

        const token = await response.json();
        const tokenSession = {
            accessToken: token.access_token,
            expiresAt: Date.now() + token.expires_in * 1000,
        };
        sessionStorage.setItem(DROPBOX_TOKEN_KEY, JSON.stringify(tokenSession));
        if (isBrowse) {
            await loadDropboxFiles(tokenSession.accessToken);
        } else {
            await uploadToDropbox(tokenSession.accessToken);
        }
    } catch (error) {
        status.textContent = `${isBrowse ? "Could not open Dropbox" : "Could not save to Dropbox"}: ${error.message}`;
    }
}

// Import
function loadImportedDocument(text, filename) {
    if (editor.textContent.trim() && !window.confirm("Replace the document currently in the editor?")) {
        return false;
    }

    editor.textContent = text;
    const name = filename.replace(/\.(txt|md)$/i, "");
    workName.value = name;
    localStorage.setItem("work-name", name);
    saveEditor();
    return true;
}

async function loadDropboxFiles(accessToken) {
    importStatus.textContent = "Loading Dropbox files...";
    dropboxFiles.replaceChildren();
    const files = [];
    let cursor;
    do {
        const response = await fetch(`https://api.dropboxapi.com/2/files/${cursor ? "list_folder/continue" : "list_folder"}`, {
            method: "POST",
            headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
            },
            body: JSON.stringify(cursor ? { cursor } : { path: "" }),
        });
        if (!response.ok) {
            if (response.status === 401 || response.status === 403) sessionStorage.removeItem(DROPBOX_TOKEN_KEY);
            throw new Error(await getDropboxError(response));
        }

        const result = await response.json();
        files.push(...result.entries);
        cursor = result.has_more ? result.cursor : null;
    } while (cursor);

    const textFiles = files.filter((entry) =>
        entry[".tag"] === "file" && DROPBOX_TEXT_FILE.test(entry.name)
    );
    if (!textFiles.length) {
        importStatus.textContent = "No .txt or .md files found in your Dropbox app folder.";
        return;
    }

    for (const file of textFiles) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = file.name;
        button.addEventListener("click", async () => {
            importStatus.textContent = `Opening ${file.name}...`;
            try {
                const downloadResponse = await fetch("https://content.dropboxapi.com/2/files/download", {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${accessToken}`,
                        "Dropbox-API-Arg": JSON.stringify({ path: file.path_lower }),
                    },
                });
                if (!downloadResponse.ok) {
                    if (downloadResponse.status === 401 || downloadResponse.status === 403) {
                        sessionStorage.removeItem(DROPBOX_TOKEN_KEY);
                    }
                    throw new Error(await getDropboxError(downloadResponse));
                }

                const text = await downloadResponse.text();
                if (loadImportedDocument(text, file.name)) {
                    importStatus.textContent = `Opened ${file.name}.`;
                    dropboxFiles.replaceChildren();
                    importDialog.close();
                    editor.focus();
                } else {
                    importStatus.textContent = "Open cancelled.";
                }
            } catch (error) {
                importStatus.textContent = `Could not open ${file.name}: ${error.message}`;
            }
        });
        dropboxFiles.append(button);
    }

    importStatus.textContent = `Choose a file from your Dropbox app folder (${textFiles.length} found).`;
}

async function getDropboxAccessToken(action) {
    const savedToken = sessionStorage.getItem(DROPBOX_TOKEN_KEY);
    let tokenSession;
    try {
        tokenSession = JSON.parse(savedToken || "null");
    } catch {
        sessionStorage.removeItem(DROPBOX_TOKEN_KEY);
    }

    if (tokenSession?.accessToken && tokenSession.expiresAt > Date.now() + 30000) {
        return tokenSession.accessToken;
    }

    sessionStorage.removeItem(DROPBOX_TOKEN_KEY);
    await startDropboxAuthorization(action);
    return null;
}

// Wire up dialogs, local-file selection, and Dropbox actions.
document.getElementById("export").addEventListener("click", () => {
    exportStatus.textContent = "";
    exportDialog.showModal();
});

document.getElementById("close-export").addEventListener("click", () => {
    exportDialog.close();
});

document.getElementById("import").addEventListener("click", () => {
    importStatus.textContent = "";
    dropboxFiles.replaceChildren();
    importDialog.showModal();
});

document.getElementById("close-import").addEventListener("click", () => {
    importDialog.close();
});

document.getElementById("open-local-file").addEventListener("click", () => {
    document.getElementById("local-file").click();
});

document.getElementById("local-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    importStatus.textContent = `Opening ${file.name}...`;
    try {
        if (!DROPBOX_TEXT_FILE.test(file.name)) {
            throw new Error("Choose a .txt or .md text file.");
        }
        const text = await file.text();
        if (loadImportedDocument(text, file.name)) {
            importStatus.textContent = `Opened ${file.name}.`;
            importDialog.close();
            editor.focus();
        } else {
            importStatus.textContent = "Open cancelled.";
        }
    } catch (error) {
        importStatus.textContent = `Could not open ${file.name}: ${error.message}`;
    } finally {
        event.target.value = "";
    }
});

document.getElementById("browse-dropbox").addEventListener("click", async () => {
    importStatus.textContent = "";
    try {
        const accessToken = await getDropboxAccessToken("browse");
        if (accessToken) await loadDropboxFiles(accessToken);
    } catch (error) {
        importStatus.textContent = `Could not connect to Dropbox: ${error.message}`;
    }
});

document.getElementById("dropbox-document").addEventListener("click", async () => {
    exportStatus.textContent = "";
    try {
        const accessToken = await getDropboxAccessToken("upload");
        if (accessToken) await uploadToDropbox(accessToken);
    } catch (error) {
        exportStatus.textContent = `Could not connect to Dropbox: ${error.message}`;
    }
});

document.getElementById("download-document").addEventListener("click", () => {
    const file = createExportFile();
    const url = URL.createObjectURL(file);
    const download = document.createElement("a");
    download.href = url;
    download.download = file.name;
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    exportStatus.textContent = "Download started.";
});

document.getElementById("copy-document").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(editor.textContent);
        exportStatus.textContent = "Text copied to clipboard.";
    } catch {
        exportStatus.textContent = "Clipboard access is unavailable in this browser.";
    }
});

finishDropboxAuthorization();
</script>
