<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sloppydraft</title>
<style>
    :root {
    color-scheme: dark;
    --page-bg: #171817;
    --text: #f1eee7;
    --editor-text: #9acb82;
    --muted: #aaa99f;
    --border: var(--border);
    --field-border: var(--field-border);
    --button-border: var(--button-border);
    --placeholder: #88877d;
    --accent: #d0a869;
    --accent-hover: #e5bd7f;
}

:root.light-mode {
    color-scheme: light;
    --page-bg: #f3efe6;
    --text: #302f2b;
    --editor-text: #302f2b;
    --muted: #716f66;
    --border: #ded8cc;
    --field-border: #c9c1b3;
    --button-border: #b8b0a2;
    --placeholder: #898477;
    --accent: #9a6b2f;
    --accent-hover: #80551f;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg)
;
    color: var(--text)
;
}

body {
    min-height: 100vh;
}

.toolbar {
    min-height: 72px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 1px solid #353633;
}

.toolbar[hidden],
#show-toolbar[hidden] {
    display: none;
}

.brand {
    margin: 0;
    font: 600 12px/1 Georgia, serif;
    color: #f1eee7;
}

.toolbar-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    color: var(--muted);
    font: 14px/1.4 system-ui, sans-serif;
}

#work-name {
    width: 150px;
    min-width: 0;
    border: 1px solid #55564f;
    border-radius: 3px;
    padding: 8px 10px;
    background: transparent;
    color: #f1eee7;
    font: 13px/1.2 system-ui, sans-serif;
}

#work-name::placeholder {
    color: var(--placeholder);
}

#work-name:focus-visible {
    border-color: #d0a869;
    outline: 2px solid #e5bd7f;
    outline-offset: 2px;
}

#readme-link {
    color: #aaa99f;
    font: 12px/1.4 system-ui, sans-serif;
    text-decoration: underline;
    text-underline-offset: 3px;
}

#readme-link:hover,
#readme-link:focus-visible {
    color: #e5bd7f;
}

#word-count {
    color: #f1eee7;
    font-variant-numeric: tabular-nums;
}

#export,
#font-mode,
#light-mode,
#burn,
#hide-toolbar,
#show-toolbar {
    border: 1px solid var(--placeholder);
    border-radius: 3px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: #f1eee7;
    cursor: pointer;
}

#export svg,
#hide-toolbar svg,
#light-mode svg,
#show-toolbar svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
}

.font-icon {
    font: 600 14px/1 system-ui, sans-serif;
}

#export:hover,
#font-mode:hover,
#light-mode:hover,
#burn:hover,
#hide-toolbar:hover,
#show-toolbar:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

#export:focus-visible,
#font-mode:focus-visible,
#light-mode:focus-visible,
#burn:focus-visible,
#hide-toolbar:focus-visible,
#show-toolbar:focus-visible {
    outline: 2px solid #e5bd7f;
    outline-offset: 3px;
}

#burn-control {
    position: relative;
}

#show-toolbar {
    position: fixed;
    top: 12px;
    right: 18px;
    z-index: 2;
    background: var(--page-bg);
}

body.toolbar-hidden #editor {
    min-height: 100vh;
    padding-top: 84px;
}

#burn-prompt {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    width: max-content;
    max-width: min(220px, calc(100vw - 36px));
    color: #fff;
    font: 6pt/1.3 system-ui, sans-serif;
    text-align: center;
}

#burn-prompt[hidden] {
    display: none;
}

body.light-mode #burn-prompt {
    color: #fff !important;
}

#burn-countdown {
    font-variant-numeric: tabular-nums;
}

body.light-mode {
    background: #fff;
    color: #000;
}

body.light-mode * {
    color: #000 !important;
}

body.light-mode *::placeholder,
body.light-mode #editor:empty::before {
    color: #000 !important;
}

#editor {
    display: block;
    width: min(100%, 960px);
    min-height: calc(100vh - 72px);
    margin: 0 auto;
    border: none;
    outline: none;
    background: transparent;
    color: #f1eee7;
    font-size: clamp(12pt, 2vw, 14pt);
    font-family: Georgia, serif;
    line-height: 1.75;
    padding: 48px 40px 80px;
    caret-color: var(--editor-text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    cursor: text;
}

#editor:empty::before {
    content: attr(data-placeholder);
    color: #77776c;
    pointer-events: none;
}

#export-dialog {
    width: min(420px, calc(100vw - 32px));
    border: 1px solid var(--placeholder);
    border-radius: 4px;
    padding: 24px;
    background: var(--page-bg);
    color: var(--text);
}

#export-dialog::backdrop {
    background: rgb(0 0 0 / 65%);
}

.export-dialog-heading {
    margin: 0 0 20px;
    font: 600 18px/1.3 Georgia, serif;
}

.export-dialog-actions {
    display: grid;
    gap: 8px;
}

.export-dialog-actions button,
#close-export {
    min-height: 40px;
    border: 1px solid var(--placeholder);
    border-radius: 3px;
    padding: 8px 12px;
    background: transparent;
    color: inherit;
    font: 14px/1.3 system-ui, sans-serif;
    text-align: left;
    cursor: pointer;
}

.export-dialog-actions button:hover,
#close-export:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

#export-status {
    min-height: 1.4em;
    margin: 12px 0;
    color: var(--muted);
    font: 13px/1.4 system-ui, sans-serif;
}

#close-export {
    display: block;
    margin-left: auto;
}

#export-dialog button:focus-visible {
    outline: 2px solid var(--accent-hover);
    outline-offset: 2px;
}

:root.courier-mode,
:root.courier-mode * {
    font-family: "Courier New", Courier, monospace !important;
}

@media (max-width: 600px) {
    .toolbar {
        min-height: 64px;
        padding: 0 18px;
        flex-wrap: wrap;
        padding-block: 12px;
    }

    .toolbar-actions {
        flex-wrap: wrap;
        gap: 9px;
    }

    #work-name {
        width: 130px;
    }

    #editor {
        min-height: calc(100vh - 64px);
        padding: 30px 22px 60px;
    }

    body.toolbar-hidden #editor {
        padding: 66px 22px 60px;
    }
}
</style>
</head>

<body>
<header class="toolbar" id="toolbar">
    <h1 class="brand">sloppydraft</h1>
    <div class="toolbar-actions">
        <span><span id="word-count">0</span> <span id="word-label">words</span></span>
        <input id="work-name" type="text" aria-label="Work name" placeholder="Work name" autocomplete="off">
        <button id="light-mode" type="button" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 3a9 9 0 0 1 0 18 4.5 4.5 0 0 0 0-9 4.5 4.5 0 0 1 0-9Z" fill="currentColor" stroke="none"></path>
                <circle cx="8.5" cy="7.5" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="15.5" cy="16.5" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
        </button>
        <button id="font-mode" type="button" aria-label="Use Courier font" title="Use Courier font" aria-pressed="false"><span class="font-icon" aria-hidden="true">A&amp;</span></button>
        <button id="export" type="button" aria-label="Export document" title="Export document" aria-haspopup="dialog" aria-controls="export-dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15V3m0 0L8 7m4-4 4 4"></path>
                <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path>
            </svg>
        </button>
        <div id="burn-control">
            <span id="burn-prompt" role="status" aria-live="polite" hidden>
                Press this 5 times in 5 seconds to burn everything
                <span id="burn-countdown"></span>
            </span>
            <button id="burn" type="button" aria-label="Burn all writing" title="Burn all writing">🔥</button>
        </div>

        <a id="readme-link" href="README.md">README</a>
        <button id="hide-toolbar" type="button" aria-controls="toolbar" aria-expanded="true" aria-label="Hide menu and branding" title="Hide menu and branding">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14"></path>
            </svg>
        </button>
    </div>
</header>
<button id="show-toolbar" type="button" aria-controls="toolbar" aria-expanded="false" aria-label="Show menu and branding" title="Show menu and branding" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
</button>
<main>
    <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document" data-placeholder="Start writing..." spellcheck="true"></div>
</main>
<dialog id="export-dialog" aria-labelledby="export-heading">
    <h2 class="export-dialog-heading" id="export-heading">Export document</h2>
    <div class="export-dialog-actions">
        <button id="share-document" type="button">Share document</button>
        <button id="copy-document" type="button">Copy text</button>
        <button id="download-document" type="button">Download .txt</button>
    </div>
    <p id="export-status" role="status" aria-live="polite"></p>
    <button id="close-export" type="button">Close</button>
</dialog>
<script>
const editor = document.getElementById("editor");
const wordCount = document.getElementById("word-count");
const wordLabel = document.getElementById("word-label");
const workName = document.getElementById("work-name");
const lightModeButton = document.getElementById("light-mode");
const fontModeButton = document.getElementById("font-mode");
const burnButton = document.getElementById("burn");
const burnPrompt = document.getElementById("burn-prompt");
const burnCountdown = document.getElementById("burn-countdown");
const toolbar = document.getElementById("toolbar");
const hideToolbarButton = document.getElementById("hide-toolbar");
const showToolbarButton = document.getElementById("show-toolbar");
let lightMode = localStorage.getItem("light-mode") === "true";
let courierMode = localStorage.getItem("courier-mode") === "true";
let toolbarHidden = localStorage.getItem("toolbar-hidden") === "true";
let burnPresses = 0;
let burnDeadline = 0;
let burnTimer;

workName.value = localStorage.getItem("work-name") || "";

const savedHtml = localStorage.getItem("document-html");
if (savedHtml !== null) {
    editor.innerHTML = savedHtml;
} else {
    editor.textContent = localStorage.getItem("document") || "";
}

editor.querySelectorAll("s, del").forEach((markedWord) => {
    markedWord.replaceWith(document.createTextNode(`~~${markedWord.textContent}~~`));
});

function updateFontMode() {
    document.documentElement.classList.toggle("courier-mode", courierMode);
    fontModeButton.setAttribute("aria-pressed", String(courierMode));
    fontModeButton.setAttribute("aria-label", courierMode ? "Use serif font" : "Use Courier font");
    fontModeButton.title = courierMode ? "Use serif font" : "Use Courier font";
}

function updateLightMode() {
    document.documentElement.classList.toggle("light-mode", lightMode);
    document.body.classList.toggle("light-mode", lightMode);
    lightModeButton.setAttribute("aria-pressed", String(lightMode));
    lightModeButton.setAttribute("aria-label", lightMode ? "Switch to dark mode" : "Switch to light mode");
    lightModeButton.title = lightMode ? "Switch to dark mode" : "Switch to light mode";
}

function setToolbarHidden(hidden, moveFocus = true) {
    toolbarHidden = hidden;
    toolbar.hidden = hidden;
    showToolbarButton.hidden = !hidden;
    hideToolbarButton.setAttribute("aria-expanded", String(!hidden));
    showToolbarButton.setAttribute("aria-expanded", String(hidden));
    document.body.classList.toggle("toolbar-hidden", hidden);
    localStorage.setItem("toolbar-hidden", String(hidden));

    if (moveFocus) {
        (hidden ? showToolbarButton : hideToolbarButton).focus();
    }
}

function saveEditor() {
    localStorage.setItem("document-html", editor.innerHTML);
    const words = editor.textContent.trim().match(/\S+/g) || [];
    wordCount.textContent = words.length;
    wordLabel.textContent = words.length === 1 ? "word" : "words";
}

function textOffsetAt(node, offset) {
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.setEnd(node, offset);
    return range.toString().length;
}

function pointAtTextOffset(targetOffset) {
    const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
    let node;
    let lastNode;
    let remaining = targetOffset;

    while ((node = walker.nextNode())) {
        lastNode = node;
        if (remaining <= node.nodeValue.length) {
            return { node, offset: remaining };
        }
        remaining -= node.nodeValue.length;
    }

    return lastNode
        ? { node: lastNode, offset: lastNode.nodeValue.length }
        : { node: editor, offset: 0 };
}

function markWord(key) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;

    const words = Array.from(editor.textContent.matchAll(/\S+/g), (match) => ({
        start: match.index,
        end: match.index + match[0].length,
    }));
    let start;
    let end;

    if (!selection.isCollapsed) {
        const selected = selection.getRangeAt(0);
        const selectionStart = textOffsetAt(selected.startContainer, selected.startOffset);
        const selectionEnd = textOffsetAt(selected.endContainer, selected.endOffset);
        const selectedWords = words.filter((word) => word.end > selectionStart && word.start < selectionEnd);
        if (selectedWords.length) {
            start = selectedWords[0].start;
            end = selectedWords[selectedWords.length - 1].end;
        }
    } else {
        const cursor = textOffsetAt(selection.focusNode, selection.focusOffset);
        const currentWord = words.find((word) => cursor > word.start && cursor < word.end);
        const target = currentWord || (key === "Backspace"
            ? words.filter((word) => word.end <= cursor).at(-1)
            : words.find((word) => word.start >= cursor));
        if (target) ({ start, end } = target);
    }

    if (start === undefined) return;

    const range = document.createRange();
    const rangeStart = pointAtTextOffset(start);
    const rangeEnd = pointAtTextOffset(end);
    range.setStart(rangeStart.node, rangeStart.offset);
    range.setEnd(rangeEnd.node, rangeEnd.offset);
    const markedContents = range.extractContents();
    const markedWord = document.createDocumentFragment();
    const openingMarker = document.createTextNode("~~");
    const closingMarker = document.createTextNode("~~");
    markedWord.append(openingMarker, markedContents, closingMarker);
    range.insertNode(markedWord);
    range.setStartAfter(closingMarker);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    saveEditor();
}

function insertTextAtSelection(text) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    range.deleteContents();
    const textNode = document.createTextNode(text);
    range.insertNode(textNode);
    range.setStartAfter(textNode);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    saveEditor();
}

updateLightMode();
updateFontMode();
setToolbarHidden(toolbarHidden, false);
saveEditor();

hideToolbarButton.addEventListener("click", () => setToolbarHidden(true));
showToolbarButton.addEventListener("click", () => setToolbarHidden(false));

editor.addEventListener("input", () => {
    saveEditor();
});

workName.addEventListener("input", () => {
    localStorage.setItem("work-name", workName.value);
});

editor.addEventListener("keydown", (event) => {
    if (event.key === "Backspace" || event.key === "Delete") {
        event.preventDefault();
        markWord(event.key);
    } else if (event.key === "Enter") {
        event.preventDefault();
        insertTextAtSelection("\n");
    }
});

editor.addEventListener("beforeinput", (event) => {
    if (event.inputType === "deleteContentBackward" || event.inputType === "deleteContentForward") {
        event.preventDefault();
        markWord(event.inputType === "deleteContentBackward" ? "Backspace" : "Delete");
    }
});

editor.addEventListener("paste", (event) => {
    event.preventDefault();
    insertTextAtSelection(event.clipboardData.getData("text/plain"));
});

lightModeButton.addEventListener("click", () => {
    lightMode = !lightMode;
    localStorage.setItem("light-mode", String(lightMode));
    updateLightMode();
});

fontModeButton.addEventListener("click", () => {
    courierMode = !courierMode;
    localStorage.setItem("courier-mode", String(courierMode));
    updateFontMode();
});

function updateBurnCountdown() {
    const secondsRemaining = Math.max(0, Math.ceil((burnDeadline - Date.now()) / 1000));
    burnCountdown.textContent = ` (${secondsRemaining})`;
}

function resetBurnCountdown() {
    clearInterval(burnTimer);
    burnPresses = 0;
    burnDeadline = 0;
    burnPrompt.hidden = true;
}

burnButton.addEventListener("click", () => {
    const now = Date.now();
    if (burnPresses === 0 || now >= burnDeadline) {
        clearInterval(burnTimer);
        burnPresses = 0;
        burnDeadline = now + 5000;
        burnPrompt.hidden = false;
        updateBurnCountdown();
        burnTimer = setInterval(() => {
            if (Date.now() >= burnDeadline) {
                resetBurnCountdown();
            } else {
                updateBurnCountdown();
            }
        }, 100);
    }

    burnPresses += 1;
    if (burnPresses === 5 && now < burnDeadline) {
        editor.replaceChildren();
        workName.value = "";
        localStorage.removeItem("document-html");
        localStorage.removeItem("document");
        localStorage.removeItem("work-name");
        wordCount.textContent = "0";
        wordLabel.textContent = "words";
        resetBurnCountdown();
        return;
    }

    updateBurnCountdown();
});

function createExportFile() {
    const filename = workName.value.trim()
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^\.+|\.+$/g, "") || "untitled";
    const now = new Date();
    const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
    ].join("-") + "_" + [
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0"),
    ].join("-");
    const file = new File([editor.textContent], `${filename}-${timestamp}.txt`, {
        type: "text/plain;charset=utf-8",
    });
    return file;
}

const exportDialog = document.getElementById("export-dialog");
const exportStatus = document.getElementById("export-status");
const shareDocumentButton = document.getElementById("share-document");

if (!navigator.share || !navigator.canShare?.({ files: [createExportFile()] })) {
    shareDocumentButton.hidden = true;
}

document.getElementById("export").addEventListener("click", () => {
    exportStatus.textContent = "";
    exportDialog.showModal();
});

document.getElementById("close-export").addEventListener("click", () => {
    exportDialog.close();
});

document.getElementById("download-document").addEventListener("click", () => {
    const file = createExportFile();
    const url = URL.createObjectURL(file);
    const download = document.createElement("a");
    download.href = url;
    download.download = file.name;
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    exportStatus.textContent = "Download started.";
});

document.getElementById("copy-document").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(editor.textContent);
        exportStatus.textContent = "Text copied to clipboard.";
    } catch {
        exportStatus.textContent = "Clipboard access is unavailable in this browser.";
    }
});

shareDocumentButton.addEventListener("click", async () => {
    const file = createExportFile();
    const title = workName.value.trim() || "Untitled";

    try {
        await navigator.share({ title, files: [file] });
        exportStatus.textContent = "Document shared.";
    } catch (error) {
        if (error.name !== "AbortError") {
            exportStatus.textContent = "Sharing failed. You can download the text file instead.";
        }
    }
});
</script>
</body>
</html>
